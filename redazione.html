<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FGCI Rapporti — Redazione</title>
  <meta name="description" content="Area di redazione per scrivere e pubblicare i documenti." />
  <link rel="icon" type="image/png" href="fgci.png" />
  <link rel="apple-touch-icon" href="fgci.png" />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/rapporti.css" />
</head>
<body>
  <div id="testata-root"></div>

  <main class="container">

    <!-- AREA DI LOGIN (visibile solo se non autenticato) -->
    <div id="login-area" style="display:none;">
      <div class="login-wrap">
        <h2>Accesso redazione</h2>
        <p class="sottotitolo">Inserisci nome e password per scrivere e pubblicare i documenti.</p>

        <label for="adminUsername">Nome</label>
        <input type="text" id="adminUsername" autocomplete="username" autocapitalize="off" spellcheck="false" />

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" autocomplete="current-password" />

        <button id="loginBtn" type="button">Accedi</button>
        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <!-- AREA REDAZIONE (visibile solo se autenticato) -->
    <div id="admin-content" style="display:none;">
      <div class="admin-topbar">
        <span>Connesso come <strong id="adminUsernameLabel">&mdash;</strong></span>
        <button id="logoutBtn" type="button">Esci</button>
      </div>
      <div id="redazione-root"></div>
    </div>

  </main>

  <div id="footer-root"></div>

  <script src="assets/js/rapporti-core.js"></script>
  <script src="assets/js/rapporti-redazione.js"></script>
</body>
</html>
